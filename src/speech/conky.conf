-- The speech widget: what Claude sessions are reading aloud, and what waits behind it
-- (speechqueue.py reads the speaking hook's files). Set up like the Spotify widget's
-- conky.conf; conky-mouse.py finds the window by its class, keeps it at its saved position
-- and sets always on top.
local conf = os.getenv('HOME') .. '/.config/conky-widgets/speech/'

-- Start at the saved position (root-window x y of the card), less the shadow margin, as the
-- Spotify widget's conky.conf does; see there for how gap_x and gap_y are measured.
local dir = os.getenv('CSN_DIR') or '/usr/share/conky-spotify-nowplaying'
local SHADOW = 0                          -- conky-mouse.py corrects it within a second
local sf = io.open(dir .. '/common/widget_size.py')
if sf then
    SHADOW = tonumber(sf:read('a'):match('\nSHADOW = (%d+)')) or SHADOW
    sf:close()
end
local function run(cmd)
    local p = io.popen(cmd)
    local out = p:read('a') or ''
    p:close()
    return out
end
local gap_x, gap_y = 100, 400
local f = io.open(conf .. 'position')
if f then
    local x, y = f:read('n', 'n')
    f:close()
    local mx, my = run('xrandr --listmonitors'):match('%d+: %+%*%S+ %d+/%d+x%d+/%d+%+(%-?%d+)%+(%-?%d+)')
    local dpi = tonumber(run('xrdb -query'):match('Xft%.dpi:%s*(%d+)') or '') or 96
    local scale = math.max(math.floor(dpi / 96 + 0.5), 1)
    if x and y and mx then gap_x, gap_y = (x - mx) // scale - SHADOW, (y - my) // scale - SHADOW end
end

conky.config = {
    alignment = 'top_left',
    gap_x = gap_x,
    gap_y = gap_y,
    -- The window is as big as speechqueue.py's markup, which carries the margins and width.
    minimum_width = 100,
    minimum_height = 50,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'ConkySpeechQueue',          -- conky-mouse.py finds the window by this
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,                      -- background is painted by draw.lua

    double_buffer = true,
    update_interval = 0.25,                         -- speechqueue.py writes four times a second
    border_inner_margin = 0,                        -- border_width stays at its default: at 0,
                                                    -- mutter never shows the window
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    use_xft = true,
    font = 'Ubuntu Sans:size=1',                    -- tiny; speechqueue.py sets every font
    default_color = 'd0d0d0',

    lua_load = dir .. '/speech/draw.lua',
    lua_draw_hook_pre = 'draw_background',
    lua_draw_hook_post = 'draw_widget',
    lua_mouse_hook = 'mouse',                       -- hover only; clicks are handled by conky-mouse.py
};

conky.text = [[
${lua_parse widget}\
]];
