# One compressed swap device in RAM, used before the disk swap files
# (their priorities are negative, both -1 here). Size is a quarter of RAM, capped at 8 GiB.
# The compressed data comes out of the same RAM pool the GPU's GTT draws on.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = zstd
swap-priority = 100
