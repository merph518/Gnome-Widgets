# Lower the kernel's preference for swapping anonymous memory over dropping page cache.
# vm.swappiness weighs reclaiming anonymous pages (written to swap) against reclaiming
# file-backed page cache (dropped and re-read from disk). The default of 60 swaps
# anonymous pages fairly readily; 10 makes the kernel drop page cache first.
# llama-server runs with --no-mmap and its weights sit in the GPU's GTT pool, so the
# model's weights are not file-backed page cache that a low value would drop.
# The "zz" in the file name sorts this file after the other /etc/sysctl.d files, so at
# boot, in systemd-sysctl's order, this value wins over them. procps "sysctl --system"
# applies /etc/sysctl.conf last, so a vm.swappiness line there would still override it.
vm.swappiness = 10
