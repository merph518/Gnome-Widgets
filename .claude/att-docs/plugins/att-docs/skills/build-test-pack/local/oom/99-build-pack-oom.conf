# Installed by oom-setup.sh.
# Keeps the local model away from the out-of-memory killers.
# OOMScoreAdjust lowers the kernel killer's score for the service and its children
# (llama-server). ManagedOOMPreference=avoid makes systemd-oomd prefer any other control
# group.
[Service]
OOMScoreAdjust=-500
ManagedOOMPreference=avoid
