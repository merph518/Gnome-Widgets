name: Release

# release-please keeps one release pull request open against main. It collects the
# conventional commits merged since the last tag, writes the changelog, and moves the
# version in the manifest and in every plugin.json. Merging that pull request is the
# release: the next run tags the merge and publishes the GitHub release.
#
# The token comes from the automation GitHub App, not GITHUB_TOKEN. A pull request
# GITHUB_TOKEN opens starts no workflows, so the release pull request would show no
# checks and the voice bridge would refuse to merge it. Until the App's client ID is
# set as a repository variable the job skips, so main stays green before the App exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes close together would otherwise race to edit the same release pull request.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: vars.AUTOMATION_APP_CLIENT_ID != ''
    runs-on: [self-hosted, overmind, Linux]
    timeout-minutes: 10
    steps:
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release pull request, or tag a merged one
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report the release
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
