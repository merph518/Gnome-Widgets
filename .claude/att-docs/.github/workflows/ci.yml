name: CI

# Runs the tests and the static checks on each pull request and on each push to main.
# The check name is the job name, test-all. scripts/test-all.sh keeps going after a
# failing test file and exits non-zero if any file or any static check failed.
#
# A push to main runs every test file. A pull request runs only the test files its
# change can affect (scripts/select_tests.py says which), and always the static checks,
# so the job reports a result on every pull request.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes its older run stale, so that run is cancelled.
# Runs on main are left to finish, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-all:
    runs-on: [self-hosted, overmind, Linux]
    timeout-minutes: 15
    steps:
      # The job runs the pull request's own code on a self-hosted runner, so it opens
      # by failing a pull request from a fork before anything is checked out. A failed
      # job reads red, where a skipped one would satisfy a required check. A push to
      # main has no pull request, so the step is skipped there.
      - name: Refuse a pull request from a fork
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::A pull request from a fork is not run on the overmind runners."
          exit 1

      # A pull request checks out the merge of its head into the base. A depth of two
      # fetches that merge commit and both its parents, which the test selection compares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The runners reuse their workspace, and another workflow's sparse checkout turns on
      # extensions.worktreeConfig. actions/checkout disables sparse checkout, then unsets
      # that extension, hiding the core.sparseCheckout=false it wrote to config.worktree,
      # so the old setting in .git/config applies again. Disabling here writes it to
      # .git/config and restores the full tree; on a full checkout it does nothing.
      - name: Clear a sparse checkout another workflow left behind
        run: git sparse-checkout disable

      - name: Install dependencies
        run: npm ci

      # The runners share /tmp, and its per-user quota, with every other process of the
      # same user. When the quota runs out, a test whose output cannot be written stops
      # mid-line with exit 7. The tests' scratch folders and test-all.sh's logs go to the
      # job's own temporary folder instead, which is on the runner's disk and is emptied
      # for each job.
      #
      # On a pull request, HEAD is the merge commit and HEAD^1 the base it merged onto, so
      # the change since HEAD^1 is exactly what the pull request brings. Without a second
      # parent there is no such change to read, and every test file runs.
      - name: Run the tests and the static checks
        env:
          TMPDIR: ${{ runner.temp }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            bash scripts/test-all.sh
          elif git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            bash scripts/test-all.sh --changed-since 'HEAD^1'
          else
            echo "Selection: every test file (the checkout is not a merge commit)"
            bash scripts/test-all.sh
          fi
